<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Storefront | Second Shot AI</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Short link: go/amazon/  To change where it goes, change the address in the next line only. -->
  <meta http-equiv="refresh" content="1; url=https://www.amazon.com/shop/johancraft">
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
<main class="prose" style="text-align:center;padding-top:96px">
  <h1 style="font-size:1.8rem">Taking you to our Amazon storefront</h1>
  <p class="lede" style="margin:0 auto 24px">This is an affiliate link. If you buy through it, SecondShotAI may earn a commission at no extra cost to you. As an Amazon Associate I earn from qualifying purchases.</p>
  <p><a class="btn" id="go" href="https://www.amazon.com/shop/johancraft" rel="sponsored noopener">Continue</a></p>
</main>
<script>
  // Reads the address from the refresh line above, so that line is the only place to edit.
  var m = document.querySelector('meta[http-equiv="refresh"]').content.split("url=")[1];
  if (m) { document.getElementById("go").href = m; window.location.replace(m); }
</script>
</body>
</html>
